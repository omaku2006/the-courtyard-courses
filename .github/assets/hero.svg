  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="#111110"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>

  <!-- Decorative top border -->
  <line x1="60" y1="24" x2="1140" y2="24" stroke="#c9a86a" stroke-width="0.5" opacity="0.3"/>
  <circle cx="600" cy="24" r="3" fill="#c9a86a" opacity="0.4"/>
  <line x1="540" y1="24" x2="556" y2="24" stroke="#c9a86a" stroke-width="1" opacity="0.5"/>
  <line x1="644" y1="24" x2="660" y2="24" stroke="#c9a86a" stroke-width="1" opacity="0.5"/>

  <!-- Decorative bottom border -->
  <line x1="60" y1="356" x2="1140" y2="356" stroke="#c9a86a" stroke-width="0.5" opacity="0.3"/>
  <circle cx="600" cy="356" r="3" fill="#c9a86a" opacity="0.4"/>

  <!-- Left Lamppost (scaled down from user's 1200×416 original) -->
  <g transform="translate(22 28) scale(0.82)">
    <use href="#pole"/>
  </g>

  <!-- Right Lamppost (mirrored) -->
  <g transform="translate(1178 28) scale(-0.82 0.82)">
    <use href="#pole"/>
  </g>

  <!-- Center content -->
  <g transform="translate(600 138)">
    <!-- Category eyebrow -->
    <text x="0" y="0"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13" font-weight="600" letter-spacing="4"
          fill="#c9a86a" opacity="0.7">VICTORIAN ACADEMY · E-LEARNING PLATFORM</text>

    <!-- Main title -->
    <text x="0" y="58"
          text-anchor="middle"
          font-family="Georgia, 'Songti SC', 'Times New Roman', serif"
          font-size="52" font-weight="700" letter-spacing="1"
          fill="#f5eddf">The Courtyard Courses</text>

    <!-- Subtitle -->
    <text x="0" y="92"
          text-anchor="middle"
          font-family="Georgia, 'Songti SC', 'Times New Roman', serif"
          font-size="17" font-style="italic"
          fill="#c9a86a" opacity="0.8">Teachers publish. Students enroll. Learning happens.</text>

    <!-- Thin separator -->
    <line x1="-120" y1="112" x2="120" y2="112" stroke="#c9a86a" stroke-width="0.5" opacity="0.35"/>

    <!-- Four Theme Swatches (real project proof) -->
    <g transform="translate(0 130)">
      <text x="0" y="0"
            text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="10" font-weight="600" letter-spacing="3"
            fill="#c9a86a" opacity="0.5">FOUR CURATED THEMES</text>

      <!-- Light -->
      <g transform="translate(-110 16)">
        <rect x="-24" y="-12" width="48" height="24" rx="5" fill="#f5eddf" stroke="#c9a86a" stroke-width="1"/>
        <rect x="-20" y="-8" width="14" height="8" rx="2" fill="#c9a86a" opacity="0.3"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="10" fill="#c9a86a" opacity="0.7">Light</text>
      </g>

      <!-- Parchment -->
      <g transform="translate(-37 16)">
        <rect x="-24" y="-12" width="48" height="24" rx="5" fill="#efefdf" stroke="#8b6b46" stroke-width="1"/>
        <rect x="-20" y="-8" width="14" height="8" rx="2" fill="#8b6b46" opacity="0.3"/>
        <text x="0" y="24" text-anchor="middle"
