              font-size="10" fill="#c9a86a" opacity="0.7">Parchment</text>
      </g>

      <!-- Lamplight -->
      <g transform="translate(37 16)">
        <rect x="-24" y="-12" width="48" height="24" rx="5" fill="#1f1e1c" stroke="#8c7b63" stroke-width="1"/>
        <rect x="-20" y="-8" width="14" height="8" rx="2" fill="#8c7b63" opacity="0.3"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="10" fill="#c9a86a" opacity="0.7">Lamplight</text>
      </g>

      <!-- Midnight -->
      <g transform="translate(110 16)">
        <rect x="-24" y="-12" width="48" height="24" rx="5" fill="#1c232b" stroke="#a9927d" stroke-width="1"/>
        <rect x="-20" y="-8" width="14" height="8" rx="2" fill="#a9927d" opacity="0.3"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="10" fill="#c9a86a" opacity="0.7">Midnight</text>
      </g>
    </g>
  </g>

  <!-- Bottom metadata -->
  <text x="600" y="348"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#c9a86a" opacity="0.35">React 19 · Vite · Tailwind v4 · Express 5 · MongoDB · Bun</text>
