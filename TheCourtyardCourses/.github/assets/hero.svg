<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">The Courtyard Courses</title>
  <desc id="desc">Victorian academy e-learning platform with ornate lampposts framing the title and four theme swatches below.</desc>

  <defs>
    <!-- Background ambient glow -->
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#c9a86a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>

    <!-- Lamp warm glow -->
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#ffe8b0" stop-opacity="0.95"/>
      <stop offset="30%"  stop-color="#ffd080" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#c9a86a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner lamp light -->
    <radialGradient id="innerLight" cx="50%" cy="35%" r="45%">
      <stop offset="0%"   stop-color="#fff8e8" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#ffe8b0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd080" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Pole metal gradient -->
    <linearGradient id="poleMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5a5a5a"/>
      <stop offset="30%"  stop-color="#8a8a8a"/>
      <stop offset="50%"  stop-color="#a0a0a0"/>
      <stop offset="70%"  stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
    </linearGradient>

    <!-- Lantern glass gradient -->
    <linearGradient id="glassPane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe8b0" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#ffd080" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Ornate Victorian Lamppost -->
    <g id="pole">
      <!-- === BASE === -->
      <!-- Base plate -->
      <rect x="3" y="362" width="24" height="5" rx="1.5" fill="url(#poleMetal)" stroke="#3a3a3a" stroke-width="0.6"/>
      <!-- Base feet -->
      <ellipse cx="7" cy="369" rx="3.5" ry="1.5" fill="#6a6a6a" stroke="#3a3a3a" stroke-width="0.5"/>
      <ellipse cx="23" cy="369" rx="3.5" ry="1.5" fill="#6a6a6a" stroke="#3a3a3a" stroke-width="0.5"/>
      <ellipse cx="15" cy="370" rx="4" ry="1.5" fill="#6a6a6a" stroke="#3a3a3a" stroke-width="0.5"/>

      <!-- === MAIN POLE === -->
      <rect x="13" y="210" width="4" height="152" fill="url(#poleMetal)" stroke="#3a3a3a" stroke-width="0.4"/>

      <!-- Decorative rings on pole -->
      <rect x="11.5" y="300" width="7" height="3" rx="1" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="0.5"/>
      <rect x="11.5" y="260" width="7" height="3" rx="1" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="0.5"/>
      <rect x="11.5" y="220" width="7" height="3" rx="1" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="0.5"/>

      <!-- === ORNATE BRACKET (connects pole to lantern) === -->
      <!-- Left scroll bracket -->
      <path d="M15 210 C15 200 5 195 5 185 C5 178 10 175 15 175"
            fill="none" stroke="url(#poleMetal)" stroke-width="2" stroke-linecap="round"/>
      <!-- Right scroll bracket -->
      <path d="M15 210 C15 200 25 195 25 185 C25 178 20 175 15 175"
            fill="none" stroke="url(#poleMetal)" stroke-width="2" stroke-linecap="round"/>
      <!-- Bracket decorative curls -->
      <circle cx="5" cy="185" r="2" fill="none" stroke="#7a7a7a" stroke-width="0.8"/>
      <circle cx="25" cy="185" r="2" fill="none" stroke="#7a7a7a" stroke-width="0.8"/>

      <!-- === LANTERN HOUSING === -->
      <!-- Top cap / crown -->
      <path d="M10 108 L15 102 L20 108 Z" fill="#6a6a6a" stroke="#3a3a3a" stroke-width="0.6"/>
      <!-- Crown finial ball -->
      <circle cx="15" cy="100" r="2.5" fill="#8a8a8a" stroke="#4a4a4a" stroke-width="0.5"/>
      <circle cx="15" cy="100" r="1" fill="#c9a86a" opacity="0.6"/>

      <!-- Top rim -->
      <rect x="7" y="108" width="16" height="2.5" rx="1" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="0.5"/>

      <!-- === GLASS PANELS (4 visible panes) === -->
      <!-- Back pane (darkest) -->
      <rect x="8" y="110.5" width="14" height="28" rx="0.5" fill="#2a2520" opacity="0.8"/>
      <!-- Left pane -->
      <path d="M8 110.5 L8 138.5 L11 139 L11 111 Z" fill="url(#glassPane)" stroke="#5a5040" stroke-width="0.5"/>
      <!-- Right pane -->
      <path d="M22 110.5 L22 138.5 L19 139 L19 111 Z" fill="url(#glassPane)" stroke="#5a5040" stroke-width="0.5"/>
      <!-- Center-left pane -->
      <rect x="11" y="111" width="3.5" height="27.5" fill="url(#glassPane)" stroke="#5a5040" stroke-width="0.4"/>
      <!-- Center-right pane -->
      <rect x="15.5" y="111" width="3.5" height="27.5" fill="url(#glassPane)" stroke="#5a5040" stroke-width="0.4"/>

      <!-- Vertical mullions -->
      <line x1="11" y1="110.5" x2="11" y2="139" stroke="#6a6050" stroke-width="0.8"/>
      <line x1="15" y1="110.5" x2="15" y2="139" stroke="#6a6050" stroke-width="0.8"/>
      <line x1="19" y1="110.5" x2="19" y2="139" stroke="#6a6050" stroke-width="0.8"/>

      <!-- Horizontal mullion -->
      <line x1="8" y1="124" x2="22" y2="124" stroke="#6a6050" stroke-width="0.6"/>

      <!-- Inner glow (the actual light) -->
      <rect x="9" y="111" width="12" height="27" rx="0.5" fill="url(#innerLight)" opacity="0.7"/>

      <!-- Bottom rim -->
      <rect x="7" y="138.5" width="16" height="2.5" rx="1" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="0.5"/>

      <!-- Decorative bottom finial -->
      <path d="M13 141 L15 146 L17 141" fill="none" stroke="#6a6a6a" stroke-width="1" stroke-linecap="round"/>
      <circle cx="15" cy="147" r="1.2" fill="#7a7a7a"/>

      <!-- === LAMP GLOW EFFECTS === -->
      <!-- Wide ambient glow -->
      <ellipse cx="15" cy="125" rx="28" ry="32" fill="url(#lampGlow)" opacity="0.5"/>
      <!-- Focused warm glow -->
      <ellipse cx="15" cy="122" rx="14" ry="18" fill="url(#lampGlow)" opacity="0.35"/>

      <!-- === ARM CONNECTORS (decorative side arms) === -->
      <!-- Left arm -->
      <path d="M7 141 C3 141 1 138 1 135" fill="none" stroke="#6a6a6a" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="1" cy="134" r="1" fill="#7a7a7a"/>
      <!-- Right arm -->
      <path d="M23 141 C27 141 29 138 29 135" fill="none" stroke="#6a6a6a" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="29" cy="134" r="1" fill="#7a7a7a"/>

      <!-- === BOTTOM CONNECTOR (pole to lantern) === -->
      <rect x="11" y="150" width="8" height="4" rx="1" fill="#6a6a6a" stroke="#4a4a4a" stroke-width="0.5"/>
      <path d="M12 154 L15 175 L18 154" fill="none" stroke="#5a5a5a" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="380" rx="16" fill="#0f0e0d"/>
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow)"/>

  <!-- Subtle vignette -->
  <rect width="1200" height="380" rx="16" fill="none" stroke="#000" stroke-width="60" opacity="0.15"/>

  <!-- ===== DECORATIVE TOP BORDER ===== -->
  <line x1="80" y1="22" x2="520" y2="22" stroke="#c9a86a" stroke-width="0.4" opacity="0.25"/>
  <line x1="680" y1="22" x2="1120" y2="22" stroke="#c9a86a" stroke-width="0.4" opacity="0.25"/>
  <!-- Center diamond -->
  <path d="M596 22 L600 18 L604 22 L600 26 Z" fill="#c9a86a" opacity="0.35"/>
  <!-- Side dots -->
  <circle cx="560" cy="22" r="1.5" fill="#c9a86a" opacity="0.3"/>
  <circle cx="640" cy="22" r="1.5" fill="#c9a86a" opacity="0.3"/>

  <!-- ===== DECORATIVE BOTTOM BORDER ===== -->
  <line x1="80" y1="358" x2="520" y2="358" stroke="#c9a86a" stroke-width="0.4" opacity="0.25"/>
  <line x1="680" y1="358" x2="1120" y2="358" stroke="#c9a86a" stroke-width="0.4" opacity="0.25"/>
  <path d="M596 358 L600 354 L604 358 L600 362 Z" fill="#c9a86a" opacity="0.35"/>
  <circle cx="560" cy="358" r="1.5" fill="#c9a86a" opacity="0.3"/>
  <circle cx="640" cy="358" r="1.5" fill="#c9a86a" opacity="0.3"/>

  <!-- ===== LEFT LAMPPOST ===== -->
  <g transform="translate(30 20) scale(0.9)">
    <use href="#pole"/>
  </g>

  <!-- ===== RIGHT LAMPPOST (mirrored) ===== -->
  <g transform="translate(1170 20) scale(-0.9 0.9)">
    <use href="#pole"/>
  </g>

  <!-- ===== CENTER CONTENT ===== -->
  <g transform="translate(600 130)">
    <!-- Category eyebrow -->
    <text x="0" y="-4"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="11" font-weight="600" letter-spacing="5"
          fill="#c9a86a" opacity="0.55">VICTORIAN ACADEMY · E-LEARNING</text>

    <!-- Decorative line under eyebrow -->
    <line x1="-80" y1="8" x2="80" y2="8" stroke="#c9a86a" stroke-width="0.3" opacity="0.3"/>

    <!-- Main title -->
    <text x="0" y="56"
          text-anchor="middle"
          font-family="'EB Garamond', 'Garamond', 'Georgia', 'Palatino Linotype', serif"
          font-size="50" font-weight="700" letter-spacing="2"
          fill="#f5eddf">The Courtyard</text>
    <text x="0" y="104"
          text-anchor="middle"
          font-family="'EB Garamond', 'Garamond', 'Georgia', 'Palatino Linotype', serif"
          font-size="50" font-weight="700" letter-spacing="2"
          fill="#f5eddf">Courses</text>

    <!-- Subtitle -->
    <text x="0" y="138"
          text-anchor="middle"
          font-family="'EB Garamond', 'Garamond', 'Georgia', 'Palatino Linotype', serif"
          font-size="15" font-style="italic" letter-spacing="0.5"
          fill="#c9a86a" opacity="0.75">Teachers publish. Students enroll. Learning happens.</text>

    <!-- Ornamental separator -->
    <g transform="translate(0 158)" opacity="0.4">
      <line x1="-90" y1="0" x2="-10" y2="0" stroke="#c9a86a" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="#c9a86a" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#c9a86a"/>
      <line x1="10" y1="0" x2="90" y2="0" stroke="#c9a86a" stroke-width="0.5"/>
    </g>

    <!-- ===== FOUR THEME SWATCHES ===== -->
    <g transform="translate(0 185)">
      <text x="0" y="0"
            text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="9" font-weight="600" letter-spacing="4"
            fill="#c9a86a" opacity="0.4">FOUR CURATED THEMES</text>

      <!-- Light -->
      <g transform="translate(-115 18)">
        <rect x="-26" y="-13" width="52" height="26" rx="5" fill="#f5eddf" stroke="#c9a86a" stroke-width="0.8" opacity="0.95"/>
        <rect x="-22" y="-9" width="16" height="6" rx="2" fill="#c9a86a" opacity="0.25"/>
        <rect x="-22" y="0" width="20" height="3" rx="1" fill="#c9a86a" opacity="0.12"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="9.5" font-weight="500" fill="#c9a86a" opacity="0.65">Light</text>
      </g>

      <!-- Parchment -->
      <g transform="translate(-38 18)">
        <rect x="-26" y="-13" width="52" height="26" rx="5" fill="#efefdf" stroke="#8b6b46" stroke-width="0.8" opacity="0.95"/>
        <rect x="-22" y="-9" width="16" height="6" rx="2" fill="#8b6b46" opacity="0.25"/>
        <rect x="-22" y="0" width="20" height="3" rx="1" fill="#8b6b46" opacity="0.12"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="9.5" font-weight="500" fill="#c9a86a" opacity="0.65">Parchment</text>
      </g>

      <!-- Lamplight -->
      <g transform="translate(38 18)">
        <rect x="-26" y="-13" width="52" height="26" rx="5" fill="#1f1e1c" stroke="#8c7b63" stroke-width="0.8" opacity="0.95"/>
        <rect x="-22" y="-9" width="16" height="6" rx="2" fill="#8c7b63" opacity="0.25"/>
        <rect x="-22" y="0" width="20" height="3" rx="1" fill="#8c7b63" opacity="0.12"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="9.5" font-weight="500" fill="#c9a86a" opacity="0.65">Lamplight</text>
      </g>

      <!-- Midnight -->
      <g transform="translate(115 18)">
        <rect x="-26" y="-13" width="52" height="26" rx="5" fill="#1c232b" stroke="#a9927d" stroke-width="0.8" opacity="0.95"/>
        <rect x="-22" y="-9" width="16" height="6" rx="2" fill="#a9927d" opacity="0.25"/>
        <rect x="-22" y="0" width="20" height="3" rx="1" fill="#a9927d" opacity="0.12"/>
        <text x="0" y="24" text-anchor="middle"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="9.5" font-weight="500" fill="#c9a86a" opacity="0.65">Midnight</text>
      </g>
    </g>
  </g>

  <!-- ===== BOTTOM TECH LINE ===== -->
  <text x="600" y="350"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="9.5" letter-spacing="1"
        fill="#c9a86a" opacity="0.25">React 19 · Vite · Tailwind v4 · Express 5 · MongoDB · Bun</text>
</svg>
