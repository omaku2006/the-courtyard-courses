<svg width="1200" height="470" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Courtyard Courses — a Victorian academy for modern learning">
  <title>The Courtyard Courses</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262019"/>
      <stop offset="100%" stop-color="#17130e"/>
    </linearGradient>
    <linearGradient id="titleGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="18%" stop-color="#eed9a4"/>
      <stop offset="38%" stop-color="#c9a86a"/>
      <stop offset="62%" stop-color="#e8cf9c"/>
      <stop offset="82%" stop-color="#b8955a"/>
      <stop offset="100%" stop-color="#c9a86a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a86a" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#c9a86a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night courtyard backdrop -->
  <rect width="1200" height="470" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <g fill="#c9a86a">
    <circle cx="205" cy="72" r="1.6" opacity="0.35"/>
    <circle cx="322" cy="98" r="1.1" opacity="0.30"/>
    <circle cx="520" cy="62" r="1.4" opacity="0.32"/>
    <circle cx="705" cy="84" r="1.2" opacity="0.34"/>
    <circle cx="884" cy="66" r="1.6" opacity="0.30"/>
    <circle cx="1018" cy="94" r="1.1" opacity="0.36"/>
    <circle cx="158" cy="148" r="1.0" opacity="0.26"/>
    <circle cx="1046" cy="142" r="1.2" opacity="0.28"/>
    <circle cx="430" cy="110" r="1.0" opacity="0.24"/>
    <circle cx="790" cy="120" r="1.0" opacity="0.26"/>
  </g>

  <!-- Double gold frame -->
  <rect x="14" y="14" width="1172" height="442" fill="none" stroke="#c9a86a" stroke-width="2" rx="2"/>
  <rect x="26" y="26" width="1148" height="418" fill="none" stroke="#c9a86a" stroke-width="1" opacity="0.45"/>

  <!-- Corner diamonds -->
  <g fill="#c9a86a">
    <rect x="9" y="9" width="10" height="10" transform="rotate(45 14 14)"/>
    <rect x="1181" y="9" width="10" height="10" transform="rotate(45 1186 14)"/>
    <rect x="9" y="451" width="10" height="10" transform="rotate(45 14 456)"/>
    <rect x="1181" y="451" width="10" height="10" transform="rotate(45 1186 456)"/>
  </g>

  <!-- Left lamppost -->
  <circle cx="120" cy="198" r="90" fill="url(#glow)"/>
  <polygon points="104,214 136,214 128,178 112,178" fill="#e6cd96" opacity="0.92" stroke="#c9a86a" stroke-width="1.5"/>
  <polygon points="109,178 131,178 120,162" fill="#c9a86a"/>
  <circle cx="120" cy="157" r="4" fill="#eed9a4"/>
  <rect x="116" y="214" width="8" height="180" fill="#c9a86a" opacity="0.85"/>
  <rect x="111" y="300" width="18" height="6" rx="1" fill="#c9a86a" opacity="0.85"/>
  <rect x="107" y="392" width="26" height="10" rx="2" fill="#c9a86a"/>

  <!-- Right lamppost -->
  <circle cx="1080" cy="198" r="90" fill="url(#glow)"/>
  <polygon points="1064,214 1096,214 1088,178 1072,178" fill="#e6cd96" opacity="0.92" stroke="#c9a86a" stroke-width="1.5"/>
  <polygon points="1069,178 1091,178 1080,162" fill="#c9a86a"/>
  <circle cx="1080" cy="157" r="4" fill="#eed9a4"/>
  <rect x="1076" y="214" width="8" height="180" fill="#c9a86a" opacity="0.85"/>
  <rect x="1071" y="300" width="18" height="6" rx="1" fill="#c9a86a" opacity="0.85"/>
  <rect x="1067" y="392" width="26" height="10" rx="2" fill="#c9a86a"/>

  <!-- Ground line -->
  <rect x="70" y="404" width="1060" height="2" fill="#c9a86a" opacity="0.3"/>

  <!-- Overline -->
  <text x="600" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="7" fill="#c9a86a" opacity="0.95">&#x269C; ESTABLISHED MMXXVI &#x269C;</text>

  <!-- Title -->
  <text x="600" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="10" fill="url(#titleGold)">THE COURTYARD COURSES</text>

  <!-- Divider with diamond -->
  <line x1="380" y1="220" x2="574" y2="220" stroke="#c9a86a" stroke-width="1.2" opacity="0.6"/>
  <line x1="626" y1="220" x2="820" y2="220" stroke="#c9a86a" stroke-width="1.2" opacity="0.6"/>
  <rect x="594" y="214" width="12" height="12" transform="rotate(45 600 220)" fill="#c9a86a"/>

  <!-- Tagline -->
  <text x="600" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" letter-spacing="1.5" fill="#d8c9b0">A Modern Institution of Classical Learning</text>
  <text x="600" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="5" fill="#8c7b63">COURSES &#183; COMMUNITIES &#183; SCHEDULE &#183; ANALYSIS</text>

  <!-- Theme swatches -->
  <g>
    <!-- Light -->
    <rect x="224" y="330" width="170" height="32" stroke="#c9a86a" stroke-opacity="0.55" fill="#f5eddf"/>
    <rect x="280" y="330" width="57" height="32" fill="#ede4d0"/>
    <rect x="337" y="330" width="57" height="32" fill="#c9a86a"/>
    <!-- Parchment -->
    <rect x="418" y="330" width="170" height="32" stroke="#c9a86a" stroke-opacity="0.55" fill="#efefdf"/>
    <rect x="474" y="330" width="57" height="32" fill="#e3e3d3"/>
    <rect x="531" y="330" width="57" height="32" fill="#8b6b46"/>
    <!-- Lamplight -->
    <rect x="612" y="330" width="170" height="32" stroke="#c9a86a" stroke-opacity="0.55" fill="#1f1e1c"/>
    <rect x="668" y="330" width="57" height="32" fill="#3d3a34"/>
    <rect x="725" y="330" width="57" height="32" fill="#8c7b63"/>
    <!-- Midnight -->
    <rect x="806" y="330" width="170" height="32" stroke="#c9a86a" stroke-opacity="0.55" fill="#1c232b"/>
    <rect x="862" y="330" width="57" height="32" fill="#3e4a56"/>
    <rect x="919" y="330" width="57" height="32" fill="#a9927d"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" fill="#8c7b63" text-anchor="middle">
    <text x="309" y="386">LIGHT</text>
    <text x="503" y="386">PARCHMENT</text>
    <text x="697" y="386">LAMPLIGHT</text>
    <text x="891" y="386">MIDNIGHT</text>
  </g>
</svg>
